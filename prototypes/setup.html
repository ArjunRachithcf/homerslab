<!doctype html>
<!-- PROTOTYPE, throwaway. HomersLab first-time setup, as a setup assistant (round 2): one question per screen in plain
     words, a sensible default already chosen, everything else behind "More options", progress dots, and a calm
     illustration per step. Two halves: the one-time link (this machine or its home network, 30 minutes) covers
     everything up to "mesh connected, certificate issued"; then this device joins the mesh, the admin's passkey is made
     at the sign-in's own address, and the home-network listener closes at the first sign-in over the mesh.
     On the design system: design/ here is a copy of the repository's design/. Fake data, no network. -->
