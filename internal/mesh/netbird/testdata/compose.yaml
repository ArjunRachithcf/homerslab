# The mesh contract suite's world: a self-hosted NetBird v0.82.0 and three machines on it, driven by
# contract_test.go. Always run as compose project hltest-15 (named below); the test brings it up and takes it down
# with `down -v`.
#
# Isolation:
#   - one internal network, 10.215.0.0/24: no internet, no route to the host's own NetBird or its LAN;
#   - the management API published on 127.0.0.1 only, through a second network, for the test on the host;
#   - WireGuard and every firewall rule only inside the machines' own namespaces (NET_ADMIN, nothing privileged);
#   - no bind mounts: the configs are inline, their secrets generated by the test and passed in the environment.
name: hltest-15

x-client: &client
  image: netbirdio/netbird:0.82.0@sha256:eca5b274c635bfbb04ec6724a0712d1146190dd450eea199eeb83916fdd94965
  entrypoint: ["netbird", "service", "run", "--log-file", "console"]
  cap_add: [NET_ADMIN]
  dns: [10.215.0.53]
  stop_grace_period: 3s

networks:
  mesh:
    internal: true
    ipam:
      config:
        - subnet: 10.215.0.0/24
  api:
    ipam:
      config:
        - subnet: 10.215.1.0/24

configs:
  server:
    content: |
      server:
        listenAddress: ":80"
        exposedAddress: "http://nb.hltest15.test:80"
        stunPorts: [3478]
        metricsPort: 9090
        healthcheckAddress: ":9000"
        logLevel: "info"
        logFile: "console"
        authSecret: "${HLTEST_RELAY_SECRET:?}"
        dataDir: "/var/lib/netbird"
        disableAnonymousMetrics: true
        disableGeoliteUpdate: true
        auth:
          issuer: "http://nb.hltest15.test/oauth2"
          signKeyRefreshEnabled: true
          sessionCookieEncryptionKey: "${HLTEST_COOKIE_KEY:?}"
          dashboardRedirectURIs: ["http://nb.hltest15.test/nb-auth", "http://nb.hltest15.test/nb-silent-auth"]
          cliRedirectURIs: ["http://localhost:53000/"]
        store:
          engine: "sqlite"
          encryptionKey: "${HLTEST_STORE_KEY:?}"
  corefile:
    content: |
      # The stand-in for public DNS. Nothing is forwarded anywhere.
      hltest15.test:53 {
          file /etc/coredns/hltest15.test.zone
          errors
      }
  zone:
    content: |
      $$ORIGIN hltest15.test.
      $$TTL 30
      @        IN SOA ns.hltest15.test. admin.hltest15.test. 1 7200 3600 1209600 30
      @        IN NS  ns.hltest15.test.
      ns       IN A   10.215.0.53
      nb       IN A   10.215.0.10
      outside  IN A   10.215.0.99

services:
  dns:
    image: coredns/coredns:1.13.1@sha256:9b9128672209474da07c91439bf15ed704ae05ad918dd6454e5b6ae14e35fee6
    command: ["-conf", "/etc/coredns/Corefile"]
    configs:
      - source: corefile
        target: /etc/coredns/Corefile
      - source: zone
        target: /etc/coredns/hltest15.test.zone
    networks:
      mesh:
        ipv4_address: 10.215.0.53

  # The combined server: management, signal, relay, STUN and the embedded sign-in.
  server:
    image: netbirdio/netbird-server:0.82.0@sha256:7b5b53b2dc8bc25639f791cf72d47cf86911894ff3f8a97cb79bab9be958109c
    command: ["--config", "/etc/netbird/config.yaml"]
    environment:
      NB_SETUP_PAT_ENABLED: "true"
      NB_DISABLE_GEOLOCATION: "true"
    configs:
      - source: server
        target: /etc/netbird/config.yaml
    volumes:
      - server_data:/var/lib/netbird
    dns: [10.215.0.53]
    ports: ["127.0.0.1::80"]
    stop_grace_period: 3s
    networks:
      mesh:
        ipv4_address: 10.215.0.10
        aliases: [nb.hltest15.test]
      api: {}

  # The primary: NetBird's daemon as the agent leaves it, NAT mapper off (HLTEST_NODE_ENV comes from the agent's own
  # constant). The test joins it with `netbird up` the way the agent does.
  primary:
    <<: *client
    hostname: study-pc
    environment:
      NB_DISABLE_NAT_MAPPER: "${HLTEST_NAT_MAPPER_OFF:?}"
    volumes: [primary_state:/var/lib/netbird]
    networks:
      mesh:
        ipv4_address: 10.215.0.30

  # A household device with the client's defaults: its NAT mapper is on, as on any client from v0.68.
  phone:
    <<: *client
    hostname: phone
    volumes: [phone_state:/var/lib/netbird]
    networks:
      mesh:
        ipv4_address: 10.215.0.31

  # A node whose machine resolves through systemd-resolved (testdata/resolved).
  resolved:
    build: ./resolved
    image: hltest-15-resolved:latest
    hostname: pi
    cap_add: [NET_ADMIN]
    environment:
      UPSTREAM_DNS: 10.215.0.53
      NB_DISABLE_NAT_MAPPER: "${HLTEST_NAT_MAPPER_OFF:?}"
    volumes: [resolved_state:/var/lib/netbird]
    stop_grace_period: 3s
    networks:
      mesh:
        ipv4_address: 10.215.0.32

volumes:
  server_data:
  primary_state:
  phone_state:
  resolved_state:
