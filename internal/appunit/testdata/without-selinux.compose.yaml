# Written by HomersLab's agent, from install plan p-0123456789abcdef0123456789abcdef. Never edit by hand.
# What HomersLab adds to app everything's own compose file, as the second file of the standard compose command (ADR 0014):
#   - every service: no restart policy, the engine's nor swarm's (the app's unit restarts the app), at the app's own
#     SELinux level;
#   - the app's one upstream, a fixed address on a network of its own, which only the edge and the agent may open;
#   - every network's bridge named by the agent, so the firewall table knows it before it is made;
#   - its secrets, as files its unit copies from the credentials the agent sealed.
name: "homerslab-everything"
services:
  "db":
    restart: "no"
    deploy:
      restart_policy:
        condition: "none"
    security_opt:
      - "label=level:s0:c602,c603"
  "web":
    restart: "no"
    deploy:
      restart_policy:
        condition: "none"
    security_opt:
      - "label=level:s0:c602,c603"
    networks:
      "homerslab-upstream":
        ipv4_address: "172.31.240.18"
  "worker":
    restart: "no"
    deploy:
      restart_policy:
        condition: "none"
    security_opt:
      - "label=level:s0:c602,c603"
networks:
  "back":
    driver_opts:
      com.docker.network.bridge.name: "hla1n0"
  "default":
    driver_opts:
      com.docker.network.bridge.name: "hla1n1"
  "front":
    driver_opts:
      com.docker.network.bridge.name: "hla1n2"
  "homerslab-upstream":
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: "hla1u"
    ipam:
      config:
        - subnet: "172.31.240.16/28"
          gateway: "172.31.240.17"
secrets:
  "db-password":
    file: "/run/homerslab-app-everything/db-password"
  "secret-key":
    file: "/run/homerslab-app-everything/secret-key"
