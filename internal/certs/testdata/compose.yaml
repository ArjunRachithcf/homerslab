# The DNS provider contract suite's world: a test ACME CA (Pebble) and a test DNS server (BIND, through libdns's
# RFC 2136 provider), driven by contract_test.go. Always run as compose project hltest-16 (named below); the test brings
# it up and takes it down with `down -v`.
#
# Isolation:
#   - one internal network, 10.216.0.0/24: no internet, no route to the host's own DNS or its LAN, no published port;
#   - no bind mounts: the configs are inline, the TSIG key generated by the test and passed in the environment;
#   - the primary is a plain container whose own resolver is the stand-in for the mesh's local zone (127.0.0.1, served
#     by the test itself inside it), so the issuance runs where the household's domain resolves through the mesh.
name: hltest-16

networks:
  public:
    internal: true
    ipam:
      config:
        - subnet: 10.216.0.0/24

configs:
  named:
    content: |
      options {
          directory "/var/cache/bind";
          listen-on { any; };
          listen-on-v6 { none; };
          recursion no;
          allow-query { any; };
          dnssec-validation no;
          notify no;
      };
      key "homerslab." {
          algorithm hmac-sha256;
          secret "${HLTEST_TSIG:?}";
      };
      zone "example.test" {
          type primary;
          file "/var/cache/bind/example.test.zone";
          update-policy { grant homerslab. zonesub ANY; };
          allow-transfer { key homerslab.; };
      };
      zone "cluster.test" {
          type primary;
          file "/etc/bind-hl/cluster.test.zone";
      };
  # The household's zone as a registrar and a mail provider leave it, with the public path's wildcard CNAME to the
  # cluster (classic's zone, 2026-10-21).
  household:
    content: |
      $$TTL 60
      @       IN SOA ns.example.test. admin.example.test. 1 7200 3600 1209600 60
      @       IN NS  ns.example.test.
      ns      IN A   10.216.0.53
      ; The name server on IPv6 too, which the primary (IPv4 only) can't reach: the propagation check skips it.
      ns      IN AAAA 2001:db8::53
      @       IN MX  10 mx.mail.test.
      @       IN TXT "v=spf1 include:_spf.mail.test ~all"
      _dmarc  IN TXT "v=DMARC1; p=quarantine"
      *       IN CNAME proxy.cluster.test.
      www     IN CNAME example.test.
  cluster:
    content: |
      $$TTL 60
      @       IN SOA ns.cluster.test. admin.cluster.test. 1 7200 3600 1209600 60
      @       IN NS  ns.example.test.
      proxy   IN A   10.216.0.99
  pebble:
    content: |
      {"pebble": {
        "listenAddress": "0.0.0.0:14000",
        "managementListenAddress": "0.0.0.0:15000",
        "certificate": "test/certs/localhost/cert.pem",
        "privateKey": "test/certs/localhost/key.pem",
        "httpPort": 5002, "tlsPort": 5001, "ocspResponderURL": "",
        "externalAccountBindingRequired": false,
        "retryAfter": {"authz": 1, "order": 1},
        "keyAlgorithm": "ecdsa",
        "profiles": {"default": {"description": "90 days, as Let's Encrypt's", "validityPeriod": 7776000}}
      }}

services:
  dns:
    image: internetsystemsconsortium/bind9:9.20@sha256:66092edb53c081fa11b1fa8219e99065b0f497cb38f568ba789702a4c10e2590
    entrypoint: ["sh", "-c", "cp /etc/bind-hl/example.test.zone /var/cache/bind/ && chown bind:bind /var/cache/bind/example.test.zone && exec /usr/sbin/named -u bind -g -c /etc/bind-hl/named.conf"]
    configs:
      - source: named
        target: /etc/bind-hl/named.conf
      - source: household
        target: /etc/bind-hl/example.test.zone
      - source: cluster
        target: /etc/bind-hl/cluster.test.zone
    stop_grace_period: 2s
    networks:
      public:
        ipv4_address: 10.216.0.53

  # The CA validates the challenge against the test DNS server only.
  pebble:
    image: ghcr.io/letsencrypt/pebble:2.10.1@sha256:ddf230642b1a584f519f32e347de1b05a6e4c1f6c35c1863b33effeab5f78199
    command: ["-config", "/test/config/hltest.json", "-dnsserver", "10.216.0.53:53"]
    environment:
      PEBBLE_VA_NOSLEEP: "1"
      PEBBLE_WFE_NONCEREJECT: "0"
      PEBBLE_AUTHZREUSE: "0" # every order proves the domain again: a renewal with a broken token fails, as it would
    configs:
      - source: pebble
        target: /test/config/hltest.json
    stop_grace_period: 2s
    networks:
      public:
        ipv4_address: 10.216.0.14

  primary:
    image: alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
    command: ["sleep", "infinity"]
    dns: [127.0.0.1]
    init: true
    stop_grace_period: 1s
    networks:
      public:
        ipv4_address: 10.216.0.30
