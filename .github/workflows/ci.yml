# Go tests, the web app's checks and build, and the flow tests of first-time setup in a real browser.
# Actions and images are pinned by digest; the comments name the versions. Nothing here holds a secret. Every command
# that prints third-party text runs through .github/scripts/stop-commands.sh, so that text can't be a workflow command.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (as root, so the primary's two processes are tested)
    runs-on: ubuntu-24.04
    container:
      # The index digest; per architecture, linux/amd64 is sha256:2cd7e1ebf475c6208122d2b9cefc638d98fcc8dfd8554c8872c9dd0c21f4ac61
      # and linux/arm64/v8 sha256:96335ac31f35abde9f40cbb1032e06d8571fc43c51230e9a90e14145debc6199.
      image: golang:1.27.4@sha256:08bcb99a38f85a265f9a93d1d3323e2440eec333380f3ea26ee0dec9264bb41c
      # Test isolation: any container engine a test reaches points at nowhere. Set inside the container only:
      # the runner itself reaches the job's container through DOCKER_HOST, so a job-wide value breaks checkout.
      env:
        DOCKER_HOST: unix:///nonexistent
        CONTAINER_HOST: unix:///nonexistent
    env:
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go vet
        run: go vet ./...
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go test
        run: go test -race -count=1 ./...

  web:
    name: Web app (lint, types, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sh ../.github/scripts/stop-commands.sh npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  flow:
    name: Flow tests (first-time setup in a browser)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the pages, then the binary that carries them
        run: |
          (cd web && sh ../.github/scripts/stop-commands.sh npm ci --ignore-scripts && npm run build)
          CGO_ENABLED=0 go build -trimpath -o bin/homerslab ./cmd/homerslab
      - name: Install the browser
        working-directory: web
        run: sh ../.github/scripts/stop-commands.sh npx playwright install --with-deps chromium
      - name: Flow tests
        working-directory: web
        # Test isolation, as in the Go job.
        env:
          DOCKER_HOST: unix:///nonexistent
          CONTAINER_HOST: unix:///nonexistent
        run: npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
