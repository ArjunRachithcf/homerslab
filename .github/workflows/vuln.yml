# Known vulnerabilities in what HomersLab ships (#98): govulncheck for the Go module, npm audit for the web app.
# The rule for both: a finding in code we call, or in a package that ships in the binary, fails the job. A finding
# only in the module graph, or only in a development tool, is listed in the log and doesn't fail.
# Runs on every PR, and nightly on main and integration (a schedule runs from main's copy of this file).
# Actions and images are pinned by digest; the comments name the versions. Nothing here holds a secret. Every command
# that prints third-party text runs through .github/scripts/stop-commands.sh, so that text can't be a workflow command.
name: vuln

on:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vuln-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    # The branch is in the name only for the nightly's matrix: on a PR the name stays the same, so it can be a required
    # status check.
    name: govulncheck${{ matrix.ref && format(' ({0})', matrix.ref) || '' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Nightly: both long-lived branches. Otherwise: the ref the event names (an empty ref is checkout's default).
        ref: ${{ fromJSON(github.event_name == 'schedule' && '["main","integration"]' || '[""]') }}
    container:
      # The index digest; per architecture, linux/amd64 is sha256:2cd7e1ebf475c6208122d2b9cefc638d98fcc8dfd8554c8872c9dd0c21f4ac61
      # and linux/arm64/v8 sha256:96335ac31f35abde9f40cbb1032e06d8571fc43c51230e9a90e14145debc6199.
      image: golang:1.27.4@sha256:08bcb99a38f85a265f9a93d1d3323e2440eec333380f3ea26ee0dec9264bb41c
    env:
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      # govulncheck's version and sums are pinned in tools/go.mod and tools/go.sum. Built for this runner first, so the
      # scans below can name another target without govulncheck itself being built for it.
      - name: Build govulncheck
        run: |
          sh .github/scripts/stop-commands.sh go -C tools mod tidy -diff
          sh .github/scripts/stop-commands.sh go -C tools build -o /usr/local/bin/govulncheck golang.org/x/vuln/cmd/govulncheck
      # Each target the packages ship for, as the binary is built (CGO_ENABLED=0). Exit 3 means the code calls a
      # vulnerable symbol, the standard library's included. Findings only in imported packages or required modules
      # are listed under "Package Results" and "Module Results" and exit 0. A hypothetical example, since x/crypto
      # isn't in the module graph today: GO-2026-5932 (x/crypto's openpgp, with no tagged fix) would be listed and
      # pass if x/crypto were required and openpgp never imported (proven on #113's throwaway PR #112).
      - name: govulncheck ./... (linux/amd64)
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: sh .github/scripts/stop-commands.sh govulncheck -show verbose ./...
      - name: govulncheck ./... (linux/arm64)
        if: ${{ !cancelled() }}
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: sh .github/scripts/stop-commands.sh govulncheck -show verbose ./...

  npm:
    name: npm audit${{ matrix.ref && format(' ({0})', matrix.ref) || '' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(github.event_name == 'schedule' && '["main","integration"]' || '[""]') }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # npm audit reads package-lock.json; nothing is installed and no package script runs. The first step lists every
      # advisory and warns only for one not in audit-accepted.json (the known dev-only ones), or when npm gave no
      # report; it never fails on an advisory (a broken audit-accepted.json does fail it). npm's own listing follows,
      # each advisory's path and fix. The second step fails on any advisory in a package that ships: accepting it in
      # audit-accepted.json doesn't excuse it.
      - name: Every advisory, development tools included (warns on one not accepted, never fails on one)
        run: |
          status=0
          sh ../.github/scripts/stop-commands.sh sh -c 'npm audit --json > "$1"' sh "$RUNNER_TEMP/npm-audit.json" || status=$?
          echo "npm audit exited $status"
          node scripts/audit-accepted.mjs audit-accepted.json < "$RUNNER_TEMP/npm-audit.json"
          sh ../.github/scripts/stop-commands.sh npm audit || true
      - name: Advisories in the packages that ship (fail the job)
        run: sh ../.github/scripts/stop-commands.sh npm audit --omit=dev
