# Each user has a fixed uid and its own group of the same fixed gid, outside the ranges app images commonly run as
# (999, 1000 and the like, which sysusers would otherwise hand out): in 60578–61183, which systemd's UID/GID map
# leaves unused (#190). A container whose user shared one could signal or trace its processes, or own its files.
# The manager's user. The agent's socket is open to its group.
g homerslab 60600
u homerslab 60600:homerslab "HomersLab manager" /var/lib/homerslab
# The edge's user. Its group may open the edge's admin socket: only the agent is in it (SupplementaryGroups).
g homerslab-edge 60601
u homerslab-edge 60601:homerslab-edge "HomersLab edge" /var/lib/homerslab-edge
# The user of the agent's compose reads (homerslab agent read-project): only they run as it, so no other process
# shares its uid to signal or trace a read's child, as any could with nobody (#183). The agent refuses to read without it.
g homerslab-read 60602
u homerslab-read 60602:homerslab-read "HomersLab compose reads" / /usr/sbin/nologin
