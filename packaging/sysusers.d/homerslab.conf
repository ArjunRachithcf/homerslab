# The manager's user. The agent's socket is open to its group.
u homerslab - "HomersLab manager" /var/lib/homerslab
# The edge's user. Its group may open the edge's admin socket: only the agent is in it (SupplementaryGroups).
u homerslab-edge - "HomersLab edge" /var/lib/homerslab-edge
# The user of the agent's compose reads (homerslab agent read-project): only they run as it, so no other process
# shares its uid to signal or trace a read's child, as any could with nobody (#183). The agent refuses to read without it.
u homerslab-read - "HomersLab compose reads" / /usr/sbin/nologin
