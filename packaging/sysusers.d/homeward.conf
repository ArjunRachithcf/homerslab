# Each user has a fixed uid and its own group of the same fixed gid, outside the ranges app images commonly run as
# (999, 1000 and the like, which sysusers would otherwise hand out): in 60578–61183, which systemd's UID/GID map
# leaves unused (#190). A container whose user shared one could signal or trace its processes, or own its files.
# The manager's user. The agent's socket is open to its group.
g homeward 60600
u homeward 60600:homeward "Homeward manager" /var/lib/homeward
# The edge's user. Its group may open the edge's admin socket: only the agent is in it (SupplementaryGroups).
g homeward-edge 60601
u homeward-edge 60601:homeward-edge "Homeward edge" /var/lib/homeward-edge
# The user of the agent's compose reads (homeward agent read-project): only they run as it, so no other process
# shares its uid to signal or trace a read's child, as any could with nobody (#183). The agent refuses to read without it.
g homeward-read 60602
u homeward-read 60602:homeward-read "Homeward compose reads" / /usr/sbin/nologin
# Home's user (#21): in no group but its own. It reads the projection, in a folder of its group that the manager writes.
g homeward-home 60603
u homeward-home 60603:homeward-home "Homeward Home" / /usr/sbin/nologin
# The sign-in listener's LDAPS port (#204): in no group but its own. It reads the edge's certificate only as its own
# unit's credentials, and opens only the LDAP outpost's port.
g homeward-ldaps 60604
u homeward-ldaps 60604:homeward-ldaps "Homeward LDAPS" / /usr/sbin/nologin
