# The folders where the agent writes drop-ins, the only places under /etc/systemd it may write (agent.RootWrites):
# NetBird's (NAT mapper off) and the edge's (its certificates, as sealed credentials).
d /etc/systemd/system/netbird.service.d 0755 root root -
d /etc/systemd/system/homerslab-edge.service.d 0755 root root -
