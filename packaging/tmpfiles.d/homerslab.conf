# The folders where the agent writes drop-ins, the only places under /etc/systemd it may write (agent.RootWrites):
# NetBird's (NAT mapper off), the edge's (its certificates, as sealed credentials) and the sign-in's (its secrets); and
# the folder of apps' units, which systemd links from there (#19).
d /etc/systemd/system/netbird.service.d 0755 root root -
d /etc/systemd/system/homerslab-edge.service.d 0755 root root -
d /etc/systemd/system/homerslab-authentik.service.d 0755 root root -
d /etc/homerslab 0755 root root -
d /etc/homerslab/units 0755 root root -
