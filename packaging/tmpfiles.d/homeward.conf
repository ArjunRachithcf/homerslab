# The folders where the agent writes drop-ins, the only places under /etc/systemd it may write (agent.RootWrites):
# NetBird's (NAT mapper off, its control socket root's), tailscaled's (its control socket root's, #200), the edge's (its
# certificates, as sealed credentials), the sign-in's (its secrets), its LDAP outpost's (its token) and its LDAPS port's
# (the sign-in's certificate, #204); and the folder of apps' units, which systemd links from there (#19).
d /etc/systemd/system/netbird.service.d 0755 root root -
d /etc/systemd/system/tailscaled.service.d 0755 root root -
d /etc/systemd/system/homeward-edge.service.d 0755 root root -
d /etc/systemd/system/homeward-authentik.service.d 0755 root root -
d /etc/systemd/system/homeward-ldap.service.d 0755 root root -
d /etc/systemd/system/homeward-ldaps.service.d 0755 root root -
d /etc/homeward 0755 root root -
d /etc/homeward/units 0755 root root -
# Home's projection (#21): the manager writes it, Home's group reads it; setgid, so each file is the group's.
d /run/homeward-projection 2750 homeward homeward-home -
