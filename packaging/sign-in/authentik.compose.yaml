# The household account: Authentik, as HomersLab's packages pin it (ADR 0004, ADR 0014). homerslab-authentik.service
# runs it with the standard compose command, as compose project homerslab-authentik; systemd owns the containers, so
# no restart policy is set here.
#
# Its version follows Authentik's official compose file (https://docs.goauthentik.io/compose.yml: 2026.8.5, with
# PostgreSQL 16), with these differences:
#   - images pinned by digest (the index digests of the tags named beside them);
#   - no published port: the edge reaches the server at its fixed address on the sign-in network (172.31.250.10:9000),
#     and the database is on an internal network of its own;
#   - secrets only as files, through Compose `secrets:`, never in the environment (ADR 0011): the unit copies its
#     systemd credentials into /run/homerslab-authentik, readable only by the container user that needs each one,
#     labelled for the sign-in's own SELinux level. Authentik reads them through its file:// values; its bootstrap
#     token, which Authentik reads only from the environment, is exported inside the server's own entrypoint while the
#     file holds one, and is never in the container's configuration;
#   - no Docker socket, no custom templates and no certificates folder: the edge holds the certificate;
#   - X-Forwarded-* trusted only from the sign-in network's gateway, where the edge and the manager connect from;
#   - no telemetry: no error reporting, no startup analytics, no update check;
#   - warnings and errors logged only: Authentik logs each request's URL at info, an enrolment link's token with it,
#     and the unit's log is the journal.
name: homerslab-authentik

networks:
  sign-in:
    ipam:
      config:
        - subnet: 172.31.250.0/28
          gateway: 172.31.250.1
  database:
    internal: true

secrets:
  secret-key:
    file: /run/homerslab-authentik/secret-key
  postgres-password:
    file: /run/homerslab-authentik/postgres-password
  postgres-password-db:
    file: /run/homerslab-authentik/postgres-password-db
  bootstrap-token:
    file: /run/homerslab-authentik/bootstrap-token

volumes:
  database: {}
  data: {}

x-authentik: &authentik
  # ghcr.io/goauthentik/server:2026.8.5
  image: ghcr.io/goauthentik/server@sha256:602227a86455d6772e3d16b7d852713c4f864f40df5df894abd1285bb53979a5
  restart: "no"
  shm_size: 512mb
  security_opt:
    - label=level:s0:c1000,c1001
    - no-new-privileges:true
  environment:
    AUTHENTIK_POSTGRESQL__HOST: postgresql
    AUTHENTIK_POSTGRESQL__NAME: authentik
    AUTHENTIK_POSTGRESQL__USER: authentik
    AUTHENTIK_POSTGRESQL__PASSWORD: file:///run/secrets/postgres-password
    AUTHENTIK_SECRET_KEY: file:///run/secrets/secret-key
    AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS: 172.31.250.1/32
    AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
    AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
    AUTHENTIK_LOG_LEVEL: warning
  volumes:
    - data:/data
  depends_on:
    postgresql:
      condition: service_healthy

services:
  postgresql:
    # docker.io/library/postgres:16-alpine (16.15)
    image: docker.io/library/postgres@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    restart: "no"
    security_opt:
      - label=level:s0:c1000,c1001
      - no-new-privileges:true
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password-db
    secrets:
      - postgres-password-db
    volumes:
      - database:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d authentik -U authentik"]
      interval: 10s
      retries: 30
      start_period: 20s
      timeout: 5s

  server:
    <<: *authentik
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ -s /run/secrets/bootstrap-token ]; then
          AUTHENTIK_BOOTSTRAP_TOKEN="$$(cat /run/secrets/bootstrap-token)"
          export AUTHENTIK_BOOTSTRAP_TOKEN
        fi
        exec dumb-init -- ak server
    secrets:
      - secret-key
      - postgres-password
      - bootstrap-token
    networks:
      database: {}
      sign-in:
        ipv4_address: 172.31.250.10

  worker:
    <<: *authentik
    command: worker
    secrets:
      - secret-key
      - postgres-password
    networks:
      - database
